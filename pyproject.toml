[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tranchelab"
version = "0.1.0"
description = "Python client for the TrancheLab API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://tranchelab.com"
Repository = "https://github.com/TrancheLab/tranchelab-python"
Documentation = "https://docs.tranchelab.com"
